spring.application.name=pod.back
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pod_local}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pwd}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.error.include-stacktrace=never
server.error.include-message=always

springdoc.swagger-ui.enabled=${DEV:false}
springdoc.api-docs.enabled=${DEV:false}

baseUrl=${ENVURL:http://localhost:8080}
frontUrl=${FRONT_URL:http://localhost:4200}

#confirmation token
tokenExpiration=${TOKEN_EXPIRATION:30}

#JWT token
secretKey=${SECRET_KEY}
JwtExpiration=${JWT_EXPIRATION}

#Mail API
sender.mail=${MAIL_SENDER}
mail.api.key=${MAIL_API_KEY}
sender.name=${SENDER_NAME}



# Timeouts pour éviter de faire crash la requête HTTP en 500 si le serveur met du temps à répondre
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

