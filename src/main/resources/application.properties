spring.application.name=pod.back
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pod_local}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pwd}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.error.include-stacktrace=never
server.error.include-message=always

springdoc.swagger-ui.enabled=${DEV:false}
springdoc.api-docs.enabled=${DEV:false}

baseUrl=${ENVURL:http://localhost:8080}
frontUrl=${FRONT_URL:http://localhost:4200}

#confirmation token
tokenExpiration=${TOKEN_EXPIRATION:30}

#JWT token
secretKey=${SECRET_KEY}
JwtExpiration=${JWT_EXPIRATION}

#Mail API
sender.mail=${MAIL_SENDER}
mail.api.key=${MAIL_API_KEY}
sender.name=${SENDER_NAME}



# Timeouts pour éviter de faire crash la requête HTTP en 500 si le serveur met du temps à répondre
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Printful API
printful.api.base-url=${PRINTFUL_API_BASE_URL:https://api.printful.com}
printful.api.key=${PRINTFUL_API_KEY:}
printful.api.connect-timeout-ms=${PRINTFUL_CONNECT_TIMEOUT_MS:5000}
printful.api.read-timeout-ms=${PRINTFUL_READ_TIMEOUT_MS:10000}
printful.webhook.path-secret=${PRINTFUL_WEBHOOK_SECRET:}

# Actuator : seul /actuator/health est exposé (pour Render + Docker HEALTHCHECK)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Stockage images (Cloudflare R2, API compatible S3) -- designs/ et mockups/ sont des préfixes de
# clé, pas des vrais "albums" S3, mais jouent le même rôle d'organisation.
r2.account-id=${R2_ACCOUNT_ID:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
r2.bucket=${R2_BUCKET:}
r2.public-base-url=${R2_PUBLIC_BASE_URL:}

# Taille max des uploads (images design) -- le défaut Spring (1MB) est trop petit pour des PNG
# haute résolution.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Limites Tomcat sous-jacentes, indépendantes de spring.servlet.multipart.* ci-dessus : sans ça,
# Tomcat coupe la connexion (pas d'erreur HTTP propre, juste "Failed to fetch" côté client) dès
# ~2 Mo, avant même que Spring ne voie la requête.
server.tomcat.max-http-form-post-size=25MB
server.tomcat.max-swallow-size=25MB

